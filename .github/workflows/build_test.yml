# Lint, run the test suite with the coverage gate on every supported Python, and run the
# fastest examples. Also called by pypi_publish.yml, so nothing is published untested.

name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main, research-release ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Self-hosted CPU runners for pushes and same-repo PRs; fork PRs never
    # touch them and run on a hosted Ubuntu runner instead.
    runs-on: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && matrix.python-version == '3.12')) && fromJSON('["self-hosted","uwplasma-cpu"]') || 'ubuntu-22.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13']
    name: Python ${{ matrix.python-version }} Test
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: false
    - name: Install jaxincell
      run: |
        # venv outside the checkout so flake8 does not lint it
        uv venv --seed --clear "$RUNNER_TEMP/venv"
        # GITHUB_ENV/GITHUB_PATH only apply to later steps, so also export here
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
        export VIRTUAL_ENV="$RUNNER_TEMP/venv"
        export PATH="$VIRTUAL_ENV/bin:$PATH"
        # editable, so that coverage reports paths inside the repository
        uv pip install -e ".[dev]" pytest-xdist
    - name: Check installed package import outside source tree
      run: |
        cd "$RUNNER_TEMP"
        python -c "from jaxincell import Domain, Species, Solver, Simulation, diagnostics, plot"
    - name: Lint with flake8
      # the configuration, line length and complexity included, is in .flake8
      run: flake8 . --count --show-source --statistics

    - name: Run tests with coverage
      # fail_under = 100 and branch coverage are set in pyproject.toml
      run: pytest -n 3 --cov=jaxincell --cov-report=xml --cov-report=term --durations=10

    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.12' && github.event_name != 'release'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: uwplasma/JAX-in-Cell

  examples:
    # The tests exercise the package; this checks that the scripts people copy from
    # still run against it. These take a couple of minutes together on a CPU runner, the
    # sheath, Weibel and model-comparison scripts in the smaller preset their `--quick` flag
    # selects; the rest (bump-on-tail, two-stream, the full presets) take minutes each and
    # are left to the documentation build of the figures.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-22.04
    name: Examples
    env:
      MPLBACKEND: Agg
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install jaxincell
      run: |
        python -m pip install --upgrade pip
        pip install -e . scipy     # scipy: the kinetic roots of jaxincell.theory
    - name: Run the fastest examples
      run: |
        for script in 2_intermediate/collisions 2_intermediate/wall_reflection \
                      3_advanced/conservation 1_basic/langmuir_wave \
                      1_basic/parameters_and_sampling 2_intermediate/output_and_restart \
                      2_intermediate/relativistic_two_stream; do
          echo "::group::examples/$script.py"
          python "examples/$script.py"
          echo "::endgroup::"
        done
        for script in 1_basic/sheath_unmagnetized 2_intermediate/sheath_magnetized \
                      3_advanced/sheath_optimization 2_intermediate/weibel 2_intermediate/compare_models \
                      3_advanced/electron_field 2_intermediate/external_fields_3d 3_advanced/invariants; do
          echo "::group::examples/$script.py --quick"
          python "examples/$script.py" --quick
          echo "::endgroup::"
        done
