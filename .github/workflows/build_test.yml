# Lint, run the test suite with the coverage gate on every supported Python, and run the
# fastest examples. Also called by pypi_publish.yml, so nothing is published untested.

name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13']
    name: Python ${{ matrix.python-version }} Test
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install jaxincell
      run: |
        python -m pip install --upgrade pip
        # editable, so that coverage reports paths inside the repository rather
        # than inside site-packages, which codecov cannot map back to the diff
        pip install -e ".[dev]"
    - name: Check installed package import outside source tree
      run: |
        cd /tmp
        python -c "from jaxincell import Domain, Species, Solver, Simulation, diagnostics, plot"
    - name: Lint with flake8
      # the configuration, line length and complexity included, is in .flake8
      run: flake8 . --count --show-source --statistics

    - name: Run tests with coverage
      # fail_under = 100 and branch coverage are set in pyproject.toml
      run: |
        pytest --cov=jaxincell --cov-report=xml --cov-report=term --durations=10

    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.12' && github.event_name != 'release'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: uwplasma/JAX-in-Cell

  examples:
    # The tests exercise the package; this checks that the scripts people copy from
    # still run against it. These take a couple of minutes together on a CPU runner, the
    # three sheath scripts in the smaller preset their `--quick` flag selects; the rest
    # (bump-on-tail, Weibel, two-stream, the full sheath presets) take minutes each and
    # are left to the documentation build of the figures.
    runs-on: ubuntu-22.04
    name: Examples
    env:
      MPLBACKEND: Agg
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install jaxincell
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    - name: Run the fastest examples
      run: |
        for script in 2_intermediate/collisions 2_intermediate/wall_reflection \
                      3_advanced/conservation 1_basic/langmuir_wave; do
          echo "::group::examples/$script.py"
          python "examples/$script.py"
          echo "::endgroup::"
        done
        for script in 1_basic/sheath_unmagnetized 2_intermediate/sheath_magnetized \
                      3_advanced/sheath_optimization; do
          echo "::group::examples/$script.py --quick"
          python "examples/$script.py" --quick
          echo "::endgroup::"
        done
