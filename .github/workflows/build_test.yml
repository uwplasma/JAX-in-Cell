# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Self-hosted macOS runners for pushes and same-repo PRs; fork PRs never
    # touch them and run on a hosted Ubuntu runner instead.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS", "uwplasma-cpu"]') || 'ubuntu-22.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.9', '3.10', '3.11', '3.12']
    name: Python ${{ matrix.python-version }} Test
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: false
    - name: Install jaxincell
      run: |
        # venv outside the checkout so flake8 does not lint it
        uv venv --seed --clear "$RUNNER_TEMP/venv"
        # GITHUB_ENV/GITHUB_PATH only apply to later steps, so also export here
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
        export VIRTUAL_ENV="$RUNNER_TEMP/venv"
        export PATH="$VIRTUAL_ENV/bin:$PATH"
        uv pip install . flake8 pytest coverage pytest-cov pytest-xdist
        if [ -f requirements.txt ]; then uv pip install -r requirements.txt; fi
    - name: Check installed package import outside source tree
      run: |
        cd "$RUNNER_TEMP"
        python -c "import jaxincell; import jaxincell._parameters; from jaxincell import Simulation"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests with coverage
      run: |
        pytest -n 3 --cov-branch --cov-report=xml --cov=jaxincell

    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: uwplasma/JAX-in-Cell

  gpu:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: GPU smoke test
    runs-on: [self-hosted, Linux, uwplasma-gpu]
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.10'
        enable-cache: false
    - name: Install with CUDA JAX
      run: |
        uv venv
        uv pip install . pytest 'jax[cuda12]'
    - name: Check the GPU backend
      run: uv run --no-project python -c "import jax; assert jax.default_backend()=='gpu', jax.devices()"
    - name: GPU tests
      timeout-minutes: 1
      run: uv run --no-project pytest -m gpu -q -x
