name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "uwplasma-cpu"]') || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Create virtual environment
        run: |
          # venv outside the checkout so flake8 does not lint it
          uv venv --seed --clear "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
      - name: Install package and documentation dependencies
        run: |
          uv pip install ".[docs]"
      - name: Build HTML with warnings as errors
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/_build/html
