# Publish to PyPI when a GitHub release is published, and only after the test suite
# passes on the tagged commit. One trigger, so one release publishes once.

name: Upload Python Package

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/build_test.yml

  release-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from the tag, which a shallow clone lacks
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the source distribution and the wheel
        # setuptools_scm writes jaxincell/version.py during the build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # trusted publishing: no API token is stored
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
