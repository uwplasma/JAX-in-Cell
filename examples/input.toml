# Two-stream instability. Run it with:  jaxincell input.toml
# Every table maps onto a constructor argument of the Python API:
# [domain] -> Domain, [solver] -> Solver, [[species]] -> Species, [collisions] -> Collisions.

[domain]
length = 0.01            # box length in metres, spanning [-L/2, L/2]
cells = 64               # number of cells
dt_over_dx_c = 4.5       # c dt / dx; keep it below 1 whenever light waves matter
particle_bc = "periodic"
field_bc = "periodic"

[solver]
algorithm = "explicit"   # or "implicit" for the energy-conserving Crank-Nicolson scheme
field_solver = "ampere"  # or "gauss" to recompute E_x from the charge density each step
filter_passes = 2        # binomial smoothing passes on the deposited sources

[[species]]
name = "electrons"
n = 20000                # pseudo-particles
charge = -1              # in units of the elementary charge
mass = "electron"
density = 4.37e17        # m^-3
vth = [1.5e7, 0.0, 0.0]  # thermal speed per component, sqrt(2 kT/m)
drift = [6e7, 0.0, 0.0]
plus_minus = true        # flip v_x on every second particle: two counter-streaming beams
perturbation_amplitude = 5e-7
perturbation_mode = 1

[[species]]
name = "ions"
n = 20000
charge = 1
mass = "proton"
density = 4.37e17
vth = [3.5e5, 0.0, 0.0]

[run]
steps = 1200
seed = 0
store_every = 1
plot = true
