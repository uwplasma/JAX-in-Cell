# The energy-conserving implicit scheme, between reflective walls.
#
#   jaxincell inputs/conservation_implicit.toml --no-plot
#
# The explicit leapfrog conserves charge exactly and energy only approximately; the implicit
# Crank-Nicolson scheme solves a nonlinear system each step and conserves both to round-off,
# at the cost of the Picard iterations. Run this file and the same one with
# algorithm = "explicit" to see the difference in the energy drift the command prints.
# examples/3_advanced/conservation.py runs both and draws the histories.

[domain]
length = 0.01
cells = 64
dt_over_dx_c = 4.5
particle_bc = "reflective"
field_bc = "reflective"

[solver]
algorithm = "implicit"
picard_iterations = 8

[[species]]
name = "electrons"
n = 4000
charge = -1
mass = "electron"
density = 4.37e17
vth = [1.499e7, 0.0, 0.0]
drift = [5e7, 0.0, 0.0]
plus_minus = true
sampling = "quiet"
perturbation_amplitude = 5e-7
perturbation_mode = 1

[[species]]
name = "ions"
n = 4000
charge = 1
mass = "proton"
density = 4.37e17
vth = [3.5e5, 0.0, 0.0]
sampling = "quiet"

[run]
steps = 400
seed = 3
